name = "compost-app"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Static files in ./public are served directly. Anything that doesn't match a
# file (the /api/* routes) falls through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# No database_id needed: `wrangler deploy` (4.45 or newer) creates the
# database on the first deploy and keeps it linked after that.
[[d1_databases]]
binding = "DB"
database_name = "compost"
database_id = "9ba4751b-ae84-4a73-a4a9-02ade5cf75bc"

# Lets the Worker import migrations/*.sql as text and apply them itself.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# Phase 8: once an hour, for the daily reminder (src/push.js). Free plan.
[triggers]
crons = ["0 * * * *"]
